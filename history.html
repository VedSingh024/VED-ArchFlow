<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History | VED ArchFlow</title>


    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- MAIN CSS -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header class="navbar">

        <div class="logo">

            <span>VED</span> ArchFlow

        </div>


        <nav class="nav-links">

            <a href="./index.html">
                Home
            </a>


            <a href="./guide.html">
                Guide
            </a>


            <!-- ACTIVE PAGE -->

            <a
                href="./history.html"
                class="active"
            >
                History
            </a>

        </nav>

    </header>



    <!-- =========================================
         HISTORY PAGE
    ========================================== -->

    <main class="history-page">


        <!-- =========================================
             PROJECT HISTORY
        ========================================== -->

        <section class="history-header">

            <h1>
                Project History
            </h1>

        </section>



        <!-- =========================================
             HISTORY GLASS BOX
        ========================================== -->

        <section class="history-section">

            <div id="historyContainer">

                <div class="history-empty">

                    No Projects Yet

                </div>

            </div>

        </section>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <p>

            AI Powered Architectural Visualization Platform

        </p>


        <small>

            © 2026 VED ArchFlow. All Rights Reserved.

        </small>

    </footer>



    <!-- =========================================
         HISTORY PAGE STYLE
    ========================================== -->

    <style>


        /* =========================================
           FULL HISTORY PAGE
        ========================================== */

        .history-page {

            width: 100%;

            max-width: none;

            margin: 0;

            padding:

                80px

                0

                100px;

            box-sizing: border-box;

        }



        /* =========================================
           PROJECT HISTORY HEADER
        ========================================== */

        .history-header {

            width: 100%;

            padding:

                0

                4vw;

            margin:

                0

                0

                55px;

            box-sizing: border-box;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

        }



        /* =========================================
           PROJECT HISTORY
           SAME AS VED ARCHFLOW / GUIDE
        ========================================== */

        .history-header h1 {

            margin: 0;

            padding: 0;

            font-family:

                "Inter",

                sans-serif;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 3px;

            line-height: 1.5;

            text-align: center;

            color:

                rgba(

                    124,

                    140,

                    255,

                    0.9

                );

            text-transform: uppercase;

        }



        /* =========================================
           HISTORY SECTION
           FULL WIDTH
        ========================================== */

        .history-section {

            width: 100%;

            max-width: none;

            margin: 0;

            padding:

                0

                2vw;

            box-sizing: border-box;

        }



        /* =========================================
           HISTORY CONTAINER
        ========================================== */

        #historyContainer {

            width: 100%;

            max-width: none;

            margin: 0 auto;

            padding: 0;

            box-sizing: border-box;

        }



        /* =========================================
           PREMIUM GLASS BOX
        ========================================== */

        .history-empty {

            width: 100%;

            min-height: 115px;

            box-sizing: border-box;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            font-family:

                "Inter",

                sans-serif;

            font-size: 12px;

            font-weight: 500;

            letter-spacing: 0.2px;

            line-height: 1.5;

            color:

                rgba(

                    255,

                    255,

                    255,

                    0.48

                );

            white-space: nowrap;

            border:

                1px solid

                rgba(

                    255,

                    255,

                    255,

                    0.08

                );

            border-radius: 18px;

            background:

                linear-gradient(

                    135deg,

                    rgba(

                        255,

                        255,

                        255,

                        0.055

                    ),

                    rgba(

                        255,

                        255,

                        255,

                        0.015

                    )

                );

            backdrop-filter:

                blur(18px);

            -webkit-backdrop-filter:

                blur(18px);

            box-shadow:

                inset

                0

                1px

                0

                rgba(

                    255,

                    255,

                    255,

                    0.04

                ),

                0

                15px

                45px

                rgba(

                    0,

                    0,

                    0,

                    0.12

                );

            transition:

                transform

                0.25s

                ease,

                border-color

                0.25s

                ease;

        }



        /* =========================================
           HOVER
        ========================================== */

        .history-empty:hover {

            transform:

                translateY(

                    -2px

                );

            border-color:

                rgba(

                    124,

                    92,

                    255,

                    0.3

                );

        }



        /* =========================================
           LARGE SCREENS
        ========================================== */

        @media (min-width: 1400px) {

            .history-section {

                padding:

                    0

                    1.5vw;

            }

        }



        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .history-page {

                padding:

                    60px

                    0

                    80px;

            }


            .history-header {

                padding:

                    0

                    25px;

                margin-bottom:

                    40px;

            }


            .history-header h1 {

                font-size: 10px;

                letter-spacing: 2px;

            }


            .history-section {

                padding:

                    0

                    12px;

            }


            .history-empty {

                min-height: 110px;

                font-size: 11px;

                white-space: normal;

            }

        }


    </style>


</body>

</html>
